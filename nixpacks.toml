# ============================================================
# Nixpacks Configuration - Official Railway Build
# Family Health MF (TG UAN)
# FUERZA la instalación de:
#   - Python 3.11 (más estable para Django 5.0.7 + psycopg2)
#   - Node.js 20 LTS (para Vite build del frontend)
# ============================================================
[phases.setup]
# 👉 FORZAMOS PAQUETES NIX. Asi Nixpacks NO decide omitirlos.
nixPkgs = [
  "python311",
  "python311Packages.pip",
  "nodejs_20",
  "bash",
  "gcc",
  "libpq",
  "openssl",
  "cargo",
  "rustc",
  "pkg-config"
]

[phases.install]
# Creamos enlaces simbolicos python -> python3.11 pip -> pip3.11
cmds = [
  "node --version",
  "npm --version",
  "ls -la /nix/store/*python311*/bin/python3* 2>/dev/null || true",
  "ln -sf $(which python3.11 || which python3.12 || which python3) /usr/local/bin/python || true",
  "ln -sf $(which pip3.11 || which pip3) /usr/local/bin/pip || true",
  "python --version || python3 --version",
  "pip --version || true"
]

[phases.build]
cmd = "bash ./scripts/railway_build.sh"

[phases.start]
cmd = "bash ./scripts/railway_start.sh"
